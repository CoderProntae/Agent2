name: Build Agent2 for Windows

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package Windows executables
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Agent2.exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Agent2 --collect-all keyring
          --hidden-import keyring.backends.Windows main.py

      - name: Build UsageLimitEditor.exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name UsageLimitEditor --collect-all keyring
          --hidden-import keyring.backends.Windows usage_limit_editor.py

      - name: Create downloadable archive
        run: python scripts/package_release.py

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agent2-Windows-${{ github.run_number }}
          path: dist/Agent2-Windows.zip
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: Agent2-Windows-${{ github.run_number }}
          path: release-files

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-files/Agent2-Windows.zip
          name: Agent2 ${{ github.ref_name }}
          body: |
            Windows x64 standalone builds for Agent2 and UsageLimitEditor.

            See the repository README for Ollama setup, security notes, and first-run instructions.
