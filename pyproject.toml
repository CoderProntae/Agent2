[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent2-local-workspace"
version = "0.1.0"
description = "Yerel Ollama destekli masaüstü kodlama ajanı ve kota yöneticisi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
]

[project.scripts]
agent2 = "agent2.app:main"
usage-limit-editor = "agent2.admin_app:main"

[tool.setuptools.packages.find]
include = ["agent2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
